    <text x="14" y="51" fill="#58a6ff" font-family="'SF Mono', monospace" font-size="8.5">NO VSCODE • NO NODE BUILTINS</text>

    <!-- Core Files -->
    <g transform="translate(10, 68)">
      <text x="0" y="12" fill="#e6edf3" font-family="'SF Mono', monospace" font-size="11" font-weight="600">plan.ts</text>
      <text x="70" y="12" fill="#8b949e" font-family="sans-serif" font-size="9.5">Preflight &amp; blockers</text>

      <text x="0" y="34" fill="#e6edf3" font-family="'SF Mono', monospace" font-size="11" font-weight="600">execPlan.ts</text>
      <text x="84" y="34" fill="#8b949e" font-family="sans-serif" font-size="9.5">Add, Commit, Raw</text>

      <text x="0" y="56" fill="#e6edf3" font-family="'SF Mono', monospace" font-size="11" font-weight="600">shellRender.ts</text>
      <text x="96" y="56" fill="#8b949e" font-family="sans-serif" font-size="9.5">1-line preview</text>

      <text x="0" y="78" fill="#e6edf3" font-family="'SF Mono', monospace" font-size="11" font-weight="600">quote.ts</text>
      <text x="64" y="78" fill="#8b949e" font-family="sans-serif" font-size="9.5">7 shell matrices</text>

      <text x="0" y="100" fill="#e6edf3" font-family="'SF Mono', monospace" font-size="11" font-weight="600">timestamp.ts</text>
      <text x="90" y="100" fill="#8b949e" font-family="sans-serif" font-size="9.5">ISO &amp; epoch ±HHMM</text>

      <text x="0" y="122" fill="#e6edf3" font-family="'SF Mono', monospace" font-size="11" font-weight="600">jitter.ts</text>
      <text x="60" y="122" fill="#8b949e" font-family="sans-serif" font-size="9.5">Uniform working hrs</text>

      <rect x="0" y="136" width="168" height="28" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1" />
      <text x="8" y="154" fill="#d29922" font-family="'SF Mono', monospace" font-size="9.5" font-weight="600">99.33% Line Coverage</text>
