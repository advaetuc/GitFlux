      <text x="8" y="28" fill="#8b949e" font-family="sans-serif" font-size="8.5">Preact Component tree</text>

      <rect x="0" y="44" width="140" height="34" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1" />
      <text x="8" y="60" fill="#e6edf3" font-family="'SF Mono', monospace" font-size="10" font-weight="600">draftReducer.ts</text>
      <text x="8" y="72" fill="#8b949e" font-family="sans-serif" font-size="8.5">Optimistic local draft</text>

      <rect x="0" y="88" width="140" height="34" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1" />
      <text x="8" y="104" fill="#e6edf3" font-family="'SF Mono', monospace" font-size="10" font-weight="600">Strict CSP Nonce</text>
      <text x="8" y="116" fill="#8b949e" font-family="sans-serif" font-size="8.5">Zero inline eval/styles</text>

      <rect x="0" y="132" width="140" height="42" rx="4" fill="#0d1117" stroke="#1f6feb" stroke-width="0.8" />
      <text x="8" y="148" fill="#58a6ff" font-family="'SF Mono', monospace" font-size="10" font-weight="600">14.1 KB Gzip</text>
      <text x="8" y="162" fill="#8b949e" font-family="sans-serif" font-size="8.5">esbuild automatic JSX</text>
    </g>
