    <rect x="1" y="1" width="184" height="30" rx="7" fill="#21262d" />
    <circle cx="16" cy="16" r="4" fill="#58a6ff" />
    <text x="28" y="20" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">1. ENTRY POINTS</text>

    <!-- Items -->
    <g transform="translate(10, 42)">
      <rect width="166" height="36" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" />
      <text x="10" y="16" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Explorer Context</text>
      <text x="10" y="29" fill="#8b949e" font-family="'SF Mono', monospace" font-size="9">explorer/context</text>
    </g>

    <g transform="translate(10, 86)">
      <rect width="166" height="36" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" />
      <text x="10" y="16" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">SCM Changes Context</text>
      <text x="10" y="29" fill="#8b949e" font-family="'SF Mono', monospace" font-size="9">scm/resourceState/context</text>
    </g>

    <g transform="translate(10, 130)">
      <rect width="166" height="36" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" />
      <text x="10" y="16" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Command Palette</text>
      <text x="10" y="29" fill="#8b949e" font-family="'SF Mono', monospace" font-size="9">gitflux.open / Selection</text>
    </g>

    <g transform="translate(10, 174)">
