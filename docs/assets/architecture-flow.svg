  </g>

  <!-- Connection: L2 <-> L4 (via top curve) -->
  <path d="M 448 80 C 560 80 600 80 690 80" stroke="#bc8cff" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)" />
  <text x="530" y="72" fill="#bc8cff" font-family="'SF Mono', monospace" font-size="9">postMessage IPC</text>

