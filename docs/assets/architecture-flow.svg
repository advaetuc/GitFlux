      <text x="100" y="12" fill="#8b949e" font-family="sans-serif" font-size="9.5">Lifecycle &amp; Cmds</text>

      <text x="0" y="36" fill="#58a6ff" font-family="'SF Mono', monospace" font-size="11" font-weight="600">resourceResolver</text>
      <text x="120" y="36" fill="#8b949e" font-family="sans-serif" font-size="9.5">URI &amp; multi-select</text>

      <text x="0" y="60" fill="#58a6ff" font-family="'SF Mono', monospace" font-size="11" font-weight="600">repoState.ts</text>
      <text x="86" y="60" fill="#8b949e" font-family="sans-serif" font-size="9.5">250ms debounced</text>

      <text x="0" y="84" fill="#58a6ff" font-family="'SF Mono', monospace" font-size="11" font-weight="600">panelProvider.ts</text>
      <text x="114" y="84" fill="#8b949e" font-family="sans-serif" font-size="9.5">Webview handshake</text>

      <rect x="0" y="104" width="186" height="42" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1" />
      <text x="8" y="120" fill="#bc8cff" font-family="'SF Mono', monospace" font-size="10.5" font-weight="600">runner.ts (execFile)</text>
      <text x="8" y="136" fill="#8b949e" font-family="sans-serif" font-size="9">Child process gateway &amp; git mutex</text>

      <rect x="0" y="154" width="186" height="34" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1" />
      <text x="8" y="170" fill="#bc8cff" font-family="'SF Mono', monospace" font-size="10.5" font-weight="600">terminal.ts (sendText)</text>
      <text x="8" y="182" fill="#8b949e" font-family="sans-serif" font-size="9">Dedicated terminal isolation</text>
    </g>
  </g>

  <!-- Connection: L2 <-> L3 -->
  <path d="M 448 130 L 476 130" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrowGreen)" />
  <path d="M 476 142 L 448 142" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrowGreen)" />

