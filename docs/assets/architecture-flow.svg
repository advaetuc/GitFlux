      <text x="10" y="29" fill="#8b949e" font-family="'SF Mono', monospace" font-size="9">views.scm: gitflux.panel</text>
    </g>
  </g>

  <!-- Connection: L1 -> L2 -->
  <path d="M 210 156 L 236 156" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow)" />

