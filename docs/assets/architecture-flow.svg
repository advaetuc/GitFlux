    <circle cx="14" cy="16" r="4" fill="#39c5cf" />
    <text x="24" y="20" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">4. PREACT WEBVIEW</text>

