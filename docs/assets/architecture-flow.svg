<svg width="880" height="320" viewBox="0 0 880 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <pattern id="archGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#30363d" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#58a6ff" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3fb950" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="1" y="1" width="878" height="318" rx="12" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5" />
  <rect x="2" y="2" width="876" height="316" rx="11" fill="url(#archGrid)" />

  <!-- Header -->
  <g transform="translate(24, 20)">
    <text x="0" y="14" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">GITFLUX 4-LAYER SYSTEM ARCHITECTURE</text>
    <text x="340" y="14" fill="#8b949e" font-family="'SF Mono', 'Fira Code', monospace" font-size="12">AM-09 &amp; Blueprint §5.2 Isolation Boundaries</text>
  </g>

  <!-- LAYER 1: Entry Points -->
  <g transform="translate(24, 46)">
    <rect width="186" height="250" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
