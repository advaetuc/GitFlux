<svg width="880" height="220" viewBox="0 0 880 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient & Grid -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="35%" stop-color="#bc8cff" />
      <stop offset="70%" stop-color="#39c5cf" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>
    <radialGradient id="topGlow" cx="20%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0" />
    </radialGradient>
    <pattern id="gridPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#30363d" stroke-width="0.5" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect x="1" y="1" width="878" height="218" rx="12" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.5" />
  <rect x="2" y="2" width="876" height="216" rx="11" fill="url(#gridPattern)" />
  <rect x="2" y="2" width="876" height="120" rx="11" fill="url(#topGlow)" />

  <!-- Top Accent Bar -->
  <rect x="1" y="1" width="878" height="3" rx="1.5" fill="url(#accentLine)" />

  <!-- Terminal / Code Badge Accent (Top Right) -->
  <g transform="translate(690, 24)">
    <rect width="158" height="26" rx="13" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#3fb950" />
    <text x="26" y="17" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">VS CODE EXTENSION</text>
  </g>

  <!-- Title & Git Branch Icon -->
  <g transform="translate(36, 42)">
    <!-- Stylized Git Branch / Flux Vector Icon -->
    <g transform="translate(0, 4)">
      <circle cx="8" cy="8" r="4.5" fill="#58a6ff" />
      <circle cx="8" cy="34" r="4.5" fill="#3fb950" />
      <circle cx="28" cy="21" r="4.5" fill="#bc8cff" />
      <path d="M8 12.5 L8 29.5" stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round" />
      <path d="M8 29.5 C8 21 16 21 23.5 21" stroke="#bc8cff" stroke-width="2.5" fill="none" stroke-linecap="round" />
    </g>

    <!-- Main Title -->
    <text x="48" y="36" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">GitFlux</text>
    <text x="194" y="36" fill="#58a6ff" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="16" font-weight="600">--only</text>

    <!-- Subtitle -->
    <text x="4" y="74" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">
      Stage selected files &amp; commit with custom author/committer dates in VS Code
    </text>
  </g>

  <!-- Status Pills Row -->
  <g transform="translate(36, 156)">
    <!-- Pill 1: v0.1.0 Marketplace -->
    <g transform="translate(0, 0)">
      <rect width="152" height="32" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#bc8cff" />
      <text x="28" y="20" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">v0.1.0 Marketplace</text>
    </g>

    <!-- Pill 2: Zero Runtime Deps -->
    <g transform="translate(162, 0)">
      <rect width="144" height="32" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#3fb950" />
      <text x="28" y="20" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">Zero Runtime Deps</text>
    </g>

    <!-- Pill 3: 7 Shell Dialects -->
    <g transform="translate(316, 0)">
      <rect width="134" height="32" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#58a6ff" />
      <text x="28" y="20" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">7 Shell Dialects</text>
    </g>

    <!-- Pill 4: 14 KB Gzip Webview -->
    <g transform="translate(460, 0)">
      <rect width="154" height="32" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#39c5cf" />
      <text x="28" y="20" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">14 KB Gzip Webview</text>
    </g>

    <!-- Pill 5: 99.3% Core Coverage -->
    <g transform="translate(624, 0)">
      <rect width="168" height="32" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#d29922" />
      <text x="28" y="20" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">99.3% Core Coverage</text>
    </g>
  </g>
</svg>
