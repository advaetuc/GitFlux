name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm audit --omit=dev

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run Spikes S1 and S2
        run: |
          git --version
          bash docs/spikes/s1.sh
          bash docs/spikes/s2.sh
      - run: npm run test:coverage

  shell-matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            require_shells: "bash,sh,zsh,fish,pwsh"
          - os: macos-latest
            require_shells: "zsh,bash,pwsh,fish"
          - os: windows-latest
            require_shells: "cmd,powershell,pwsh,bash"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install extra shells on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish
      - name: Install extra shells on macOS
        if: runner.os == 'macOS'
        run: |
          brew install fish || true
      - name: Run Shell Matrix Suite
        env:
          REQUIRE_SHELLS: ${{ matrix.require_shells }}
        run: npm run test:shell

  integration-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        vscode-version: ["1.90.0", "stable"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build Extension and Webview
        run: npm run build
      - name: Run Integration Tests on Linux (xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration -- --version ${{ matrix.vscode-version }}
      - name: Run Integration Tests on Windows
        if: runner.os == 'Windows'
        run: npm run test:integration -- --version ${{ matrix.vscode-version }}

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-package
          path: "*.vsix"
